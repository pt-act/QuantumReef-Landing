<!DOCTYPE html>
<html>
<head>
  <title>QuantumReef Logo Preview</title>
  <style>
    body { background: #0B1120; color: white; font-family: sans-serif; padding: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 40px; }
    .item { text-align: center; }
    img { max-width: 100%; height: auto; margin-bottom: 10px; }
    .label { color: #94A3B8; font-size: 14px; }
  </style>
</head>
<body>
  <h1>QuantumReef Assets</h1>
  <div class="grid">
    <div class="item">
      <img src="assets/logo.svg" width="200" />
      <div class="label">Main Logo (logo.svg)</div>
    </div>
    <div class="item">
      <img src="assets/favicon.svg" width="64" />
      <div class="label">Favicon (favicon.svg)</div>
    </div>
    <div class="item">
      <img src="assets/icon-clawtopus.svg" width="64" />
      <div class="label">Clawtopus Icon</div>
    </div>
    <div class="item">
      <img src="assets/icon-parallel.svg" width="64" />
      <div class="label">Parallel Icon</div>
    </div>
    <div class="item">
      <img src="assets/icon-orchestration.svg" width="64" />
      <div class="label">Orchestration Icon</div>
    </div>
  </div>
  
  <h2>Social Preview</h2>
  <img src="assets/social-preview.svg" style="max-width: 600px; border: 1px solid #333;" />
  
  <h2>Hero Background</h2>
  <div style="position: relative; height: 300px; border: 1px solid #333; overflow: hidden;">
    <img src="assets/hero-bg.svg" style="position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.5;" />
    <div style="position: relative; z-index: 1; padding: 20px;">
      <h3>Hero Content Overlay</h3>
      <p>This simulates how the background looks behind content.</p>
    </div>
  </div>
</body>
</html>
