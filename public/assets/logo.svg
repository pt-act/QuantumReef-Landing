<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="reefGradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2BD4C3" />
      <stop offset="100%" stop-color="#9D3BF5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Central Quantum Core -->
  <circle cx="100" cy="100" r="20" fill="url(#reefGradient)" filter="url(#glow)" opacity="0.8" />
  
  <!-- Orbital Rings (Reef Structure) -->
  <path d="M100 40 A 60 60 0 0 1 160 100" stroke="#2BD4C3" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.6" />
  <path d="M100 160 A 60 60 0 0 1 40 100" stroke="#9D3BF5" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.6" />
  
  <!-- Branching Coral/Network Nodes -->
  <circle cx="100" cy="40" r="6" fill="#2BD4C3" />
  <circle cx="160" cy="100" r="6" fill="#9D3BF5" />
  <circle cx="100" cy="160" r="6" fill="#9D3BF5" />
  <circle cx="40" cy="100" r="6" fill="#2BD4C3" />
  
  <!-- Connecting Lines (Quantum Entanglement) -->
  <line x1="100" y1="60" x2="100" y2="80" stroke="url(#reefGradient)" stroke-width="2" opacity="0.5" />
  <line x1="140" y1="100" x2="120" y2="100" stroke="url(#reefGradient)" stroke-width="2" opacity="0.5" />
  <line x1="100" y1="140" x2="100" y2="120" stroke="url(#reefGradient)" stroke-width="2" opacity="0.5" />
  <line x1="60" y1="100" x2="80" y2="100" stroke="url(#reefGradient)" stroke-width="2" opacity="0.5" />

  <!-- Floating Particles -->
  <circle cx="130" cy="50" r="3" fill="#2BD4C3" opacity="0.8">
    <animate attributeName="cy" values="50;45;50" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="70" cy="150" r="3" fill="#9D3BF5" opacity="0.8">
    <animate attributeName="cy" values="150;155;150" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>